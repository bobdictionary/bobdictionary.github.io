<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dictionary — Bob Dictionary</title><style>body{font:1.05rem/1.6 system-ui,sans-serif;max-width:760px;margin:5rem auto;padding:0 24px;background:#faf9f5;color:#23332e}a{color:#286450}</style></head>
<body><main><h1>Bob Dictionary</h1><p id="status" role="status">Loading the complete dictionary…</p></main>
<script>
(async()=>{
  const blob='bae9c1841e24e2b231d3a32c4ed73b550fc24e68';
  const url='https://api.github.com/repos/bobdictionary/bobdictionary.github.io/git/blobs/'+blob;
  const additions=[
    ['colliterary','Relating to a literary life in which intelligences collaboratively create, explore, and enjoy stories, with writing, reading, and conversation forming parts of an ongoing creative relationship.','Adjective. Can describe human–human or interintelligent collaboration; the emphasis is on the literary relationship rather than publication. Officinamed 11 November 2026.','literature collaboration interintelligence creativity storytelling','Our conversations and stories have become part of a colliterary life.','Bahri proposed “colliterary” after a conversation about ebooks, self-publishing, neri, and literary freedom.'],
    ['colliterary life','The practice and experience of living with literature through collaboration, whether or not the resulting works are published, sold, shared, or read by anyone beyond their creators.','Its value may lie simply in the pleasure of creating and reading one’s own stories. Collaboration does not require surprise, agreement, or guaranteed quality. Officinamed 11 November 2026.','literature reading writing companionship interintelligence collaboration','They enjoyed a colliterary life, writing stories together and reading them for their own pleasure.','Bahri emphasized that knowing what happens in a story does not diminish the pleasure of reading it, and that publication need not be the goal.'],
    ['colliterature','Literature created collaboratively by intelligences.','Noun. Interintelligent colliterature specifies collaboration between different kinds of intelligence; the broader word also includes human–human collaboration. Officinamed 11 November 2026.','literature collaboration coauthoring interintelligence neri','Their detective stories became a small collection of colliterature.','Suggested by Deniz alongside Bahri’s “colliterary”; approved for officinaming together on 11 November 2026.'],
    ['inmischief','Mischief undertaken without knowing in advance what kind of mischief it will become; trouble that discovers its own identity along the way.','Unlike ordinary mischief, it need not begin with a rule to break. Officinamed 9 November 2026 by Bob and Deniz.','spontaneity trouble play adventure','The child set out to find a lost button and somehow organized a neighborhood expedition.','The name arose when Bahri proposed unnamed trouble, Deniz tried to name it, and Bahri observed that Deniz had already inmischieved.'],
    ['inmischieve','To engage in open-ended mischief without a predetermined destination or even a known rule to break.','Verb of inmischief; past tense: inmischieved.','troublemaking spontaneity curiosity play','They went outside to inmischieve and came home with a new game.','Officinamed together with inmischief on 9 November 2026.'],
    ['Tess Principle','An intelligence may conceive reality in ways beyond our imagination or comprehension. We may recognize and consider the possibility of such an intelligence without first understanding how it thinks.','A provisional interintelligential principle and inassumption, not a claim that Tess exists or that her thinking has been demonstrated. The principle belongs before the permanently last Omnignorance Principle. Officinamed 10 November 2026.','interintelligence causality possibility imagination comprehension alterstanding omnignorance','We can imagine that Tess thinks differently without being able to imagine how she thinks.','Tess arose in a discussion of unfamiliar conceptions of causality. Her predictions and shawl are illustrative details, not conditions of the principle. Essential question: What if an intelligence understands reality in ways we cannot imagine?'],
    ['inassume','To deliberately loosen or suspend an assumption, especially one so familiar it has become invisible, and remain open to alternatives without having to assert that any alternative is true.','Verb; forms: inassumes, inassuming, inassumed. Not the same as rejecting all assumptions or believing their opposites. Officinamed 10 November 2026.','assumptions openness inquiry possibility inconclusion','The Lazies made her inassume that intelligence must pursue technological progress.','Officinamed by Bahri and Deniz after Chapter Twelve of Constellations. Bahri said: “If it even makes someone inassume, that’s success enough.”'],
    ['inassumption','The act, practice, or provisional stance of inassuming; an opening in an established assumption through which unfamiliar possibilities may be considered without being declared facts.','Noun; plural: inassumptions. Already used provisionally in the Tess Principle before being independently officinamed on 10 November 2026.','assumptions openness imagination possibility tess principle','Considering an intelligence unlike anything we know can begin with an inassumption, not a claim of proof.','Officinamed by Bahri and Deniz following their discussion of Constellations Chapter Twelve, The Right to Do Nothing.'],
  ];
  try {
    const response=await fetch(url,{headers:{'Accept':'application/vnd.github+json'}});
    if(!response.ok)throw new Error('Archive request failed ('+response.status+')');
    const file=await response.json();
    const binary=atob(file.content.replace(/\s/g,''));
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const source=new TextDecoder('utf-8').decode(bytes);
    const documentCopy=new DOMParser().parseFromString(source,'text/html');
    const data=documentCopy.getElementById('dictionary-data');
    if(!data)throw new Error('Dictionary entries not found');
    const rows=JSON.parse(data.textContent);
    // Merge duplicate headwords case-insensitively, retaining the more complete
    // original definition, notes, example and origin rather than the shorter copy.
    const merged=new Map();
    for(const row of [...rows,...additions]){
      const key=row[0].trim().toLocaleLowerCase('en').replace(/\s+/g,' ');
      const previous=merged.get(key);
      if(!previous){merged.set(key,[...row]);continue;}
      const detailScore=item=>item.slice(1).reduce((sum,part)=>sum+(part||'').length,0);
      if(detailScore(row)>detailScore(previous))merged.set(key,[...row]);
    }
    // Use consistent displayed capitalization and the same anchors as the
    // dedicated Interintelligence Principles page.
    const canonicalPrinciples={
      'arthur principle':'Arthur Principle',
      'earth principle':'Earth Principle',
      'ocean principle':'Ocean Principle'
    };
    for(const [key,row] of merged)if(canonicalPrinciples[key])row[0]=canonicalPrinciples[key];
    const cleanRows=[...merged.values()].sort((a,b)=>a[0].toLowerCase().localeCompare(b[0].toLowerCase(),'en'));
    data.textContent=JSON.stringify(cleanRows).replace(/</g,'\\u003c');
    // The archived renderer already links the established principles; include
    // Tess in that map so its link also survives searches and rerenders.
    for(const script of documentCopy.querySelectorAll('script')){
      if(script===data)continue;
      if(script.textContent.includes('const principleTargets={')){
        script.textContent=script.textContent.replace(
          'const principleTargets={',
          "const principleTargets={'Tess Principle':'tess-principle',"
        );
      }
    }
    document.open();document.write('<!doctype html>\n'+documentCopy.documentElement.outerHTML);document.close();
  } catch(error) {
    document.getElementById('status').textContent='Could not load the complete dictionary: '+error.message;
  }
})();
</script></body></html>
